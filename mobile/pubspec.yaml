name: catai
description: "catai for phones: a CatChat chat client for MSU students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  crypto: 3.0.8
  flutter_secure_storage: 11.2.0
  webview_flutter: 4.14.1
  path_provider: 2.1.6
  flutter_markdown_plus: 1.0.12
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

flutter:

  uses-material-design: true
  assets:
    - assets/logo.png

# The app icon. After a change of the image, run: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: ../desktop/build/icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  min_sdk_android: 24
