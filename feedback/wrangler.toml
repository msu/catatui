# The feedback Worker. See src/md/infrastructure/feedback.md.
name = "catai-feedback"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# The URL is https://catai-feedback.tight-wave-3e23.workers.dev. No preview URLs.
workers_dev = true
preview_urls = false

# The D1 database (made with "npx wrangler d1 create catai-feedback").
[[d1_databases]]
binding = "DB"
database_name = "catai-feedback"
database_id = "7b77a14b-5bf7-4544-bf09-d0c5234c7487"

# Run "npx wrangler r2 bucket create catai-feedback-shots" first.
[[r2_buckets]]
binding = "SHOTS"
bucket_name = "catai-feedback-shots"

# IP_SALT is a secret: run "npx wrangler secret put IP_SALT". It is not in this file.
